# Publications
# Rendered by _layouts/portfolio.html in the "Publications" section,
# grouped by year (newest first), mirroring the Timeline layout.
#
# `marks` is the single legend for the whole section, printed once at the bottom.
# Because it is shared, each symbol must mean exactly one thing across all papers.
#
# Each year block has a year and a list of items. Item fields:
#   id      — optional anchor; the item gets id="pub-<id>" so the Timeline can link to it
#   title   — paper title
#   authors — list of { name, mark }, in order. `mark` must be one of the symbols
#             defined in `marks` below; omit it for plain authors.
#             The site owner's name (profile.name_en) is highlighted automatically.
#   venue   — venue line, including the year (e.g. "Findings of EMNLP 2026")
#   note    — optional dimmed suffix after the venue
#   links   — optional list of { name, url }, shown on the venue line

marks:
  - mark: "*"
    text: Equal contribution
  - mark: "†"
    text: Corresponding author

years:
